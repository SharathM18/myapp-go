<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        background: #ffffff;
        padding: 30px;
        border-radius: 8px;
        margin: 0 auto;
      }
      .header {
        font-size: 24px;
        font-weight: bold;
        color: #333333;
        margin-bottom: 20px;
      }
      .content {
        font-size: 16px;
        color: #555555;
        line-height: 1.5;
      }
      .footer {
        margin-top: 30px;
        font-size: 12px;
        color: #999999;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Welcome to MyApp, {{.FirstName}}!</div>
      <div class="content">
        <p>Hi {{.FirstName}},</p>
        <p>We are thrilled to have you on board. Your account is now active.</p>
      </div>
      <div class="footer">&copy; 2026 MyApp Inc. All rights reserved.</div>
    </div>
  </body>
</html>
