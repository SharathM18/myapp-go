version: "3"

vars:
  MYAPP_DATABASE_DSN: '{{.MYAPP_DATABASE_DSN | default ""}}'

tasks:
  help:
    desc: Display available tasks
    cmds:
      - task --list-all
    silent: true

  run-app:
    desc: Run the APP Server
    silent: true
    cmds:
      - echo 'Running the app server...'
      - go run ./cmd/app

  run-worker:
    desc: Run the Worker Server
    silent: true
    cmds:
      - echo 'Running the worker server...'
      - go run ./cmd/worker

  build-app:
    desc: Build the APP binary
    silent: true
    cmds:
      - echo 'Building APP binary...'
      - go build -o bin/app ./cmd/app

  build-worker:
    desc: Build the Worker binary
    silent: true
    cmds:
      - echo 'Building Worker binary...'
      - go build -o bin/worker ./cmd/worker

  build:
    desc: Build both App and Worker binaries
    silent: true
    cmds:
      - task: build-app
      - task: build-worker
      - echo 'All binaries built successfully...'

  test:
    desc: Run all tests
    silent: true
    cmds:
      - echo 'Running the tests...'
      - go test ./...

  tidy:
    desc: Format all .go files, and Tidy and verify Go module dependencies
    silent: true
    cmds:
      - echo 'Formatting .go files...'
      - go fmt ./...
      - echo 'Downloads missing dependencies and cleans up unused entries in go.mod and go.sum'
      - go mod tidy
      - echo 'Verifying dependencies...'
      - go mod verify

  confirm:
    desc: Confirm a potentially risky operation
    internal: true
    silent: true
    cmds:
      - |
        printf 'Are you sure you want to continue? [y/N] '
        read -r answer
        case "$answer" in
          y|Y) ;;
          *) printf 'Cancelled.\n'; exit 1 ;;
        esac

  migrations:new:
    desc: Create a new database migration file
    silent: true
    vars:
      NAME: '{{.name | default ""}}'
    cmds:
      - |
        if [ -z "{{.NAME}}" ]; then
          printf 'Error: migration name is required.\n'
          printf 'Usage: task migrations:new name=create_tasks_table\n'
          exit 1
        fi

        # Restrict names to letters, numbers, and underscores.
        case "{{.NAME}}" in
          *[!a-zA-Z0-9_]*)
            printf 'Error: use only letters, numbers, and underscores.\n'
            exit 1
            ;;
        esac

        printf 'Creating migration files for %s...\n' "{{.NAME}}"
        mkdir -p ./internal/infrastructure/database/postgres/migrations

        # 1. Run golang-migrate to get the correct sequential number
        go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest create -seq -ext sql -dir ./internal/infrastructure/database/postgres/migrations "{{.NAME}}"

        # 2. Instantly delete the down migration file
        rm -f ./internal/infrastructure/database/postgres/migrations/*_{{.NAME}}.down.sql

        printf 'Done. Kept only the .up.sql file.\n'

  migrations:up:
    desc: Apply all pending up database migrations
    silent: true
    cmds:
      - task: confirm
      - echo 'Running up migrations against database...'
      - go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest -path ./internal/infrastructure/database/postgres/migrations -database "{{.MYAPP_DATABASE_DSN}}" up

  migrations:down:
    desc: Rollback the last migration
    silent: true
    cmds:
      - task: confirm
      - echo 'Rolling back last migration...'
      - go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest -path ./internal/infrastructure/database/postgres/migrations -database "{{.MYAPP_DATABASE_DSN}}" down 1

  migrations:version:
    desc: Check current database migration version
    silent: true
    cmds:
      - go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest -path ./internal/infrastructure/database/postgres/migrations -database "{{.MYAPP_DATABASE_DSN}}" version
